[project]
name = "tenant-task-api"
version = "0.1.0"
description = "A tenant-isolated task API with idempotent writes and transactional outbox"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

